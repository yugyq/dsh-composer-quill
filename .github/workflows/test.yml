name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite runs without DSH and without a browser: host helpers, the client
      # factory, route auth and the streaming frame order are all stubbed.
      - name: Unit tests
        run: npm test

  scenarios:
    name: browser scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The simulator bundle is a build artifact and is not committed; rebuild it from
      # client.js before running the scenarios, or the suite tests yesterday's code.
      - name: Build the simulator bundle
        run: npx --yes esbuild@0.24.0 dev/harness/src.js --bundle --format=iife --target=chrome120 --outfile=dev/harness/bundle.js
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser scenarios
        run: python dev/verify_daily.py
