name: publish

# Publishes to npm through trusted publishing: no token, no OTP. npm verifies the
# GitHub OIDC identity against the trusted publisher configured on the package page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  # A published version cannot be taken back, and the tag can point at any commit:
  # run the whole suite here instead of trusting that main was green.
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` here on purpose: setup-node would inject an .npmrc with a
      # NODE_AUTH_TOKEN, and npm prefers that (bogus, empty) token over OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1; the version bundled with Node is older.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json would publish the wrong version. A manual
      # run has no tag, and the version check has nothing to compare against.
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $VERSION / tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION"
            exit 1
          fi

      # Re-running a tag must not fail the build: npm rejects an existing version.
      - name: Is this version already on the registry?
        id: exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-composer-quill@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public
